name: Secret Scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
      - name: Scan full history
        id: gitleaks
        run: |
          gitleaks detect --no-banner --redact --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json \
            --exit-code 1

      # The scan stays fail-closed (--exit-code 1). This step only makes the
      # result readable: gitleaks' console output carries no RuleID / File /
      # Line, so a failing run is otherwise undiagnosable from the job log.
      # `--redact` keeps secrets masked inside the report as well.
      - name: Publish findings
        if: always()
        run: |
          if [ ! -s gitleaks-report.json ]; then
            echo "### gitleaks: no report written (clean scan, or scan did not run)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### gitleaks findings"
            echo ""
            echo "| Rule | File | Line | Commit | Date |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | `\(.Commit[0:8])` | \(.Date) |"' gitleaks-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
